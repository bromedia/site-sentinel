name: Release

# Publishes a GitHub Release with the client package when a version tag (v0.2.0, ...) is pushed.
# The tag must point at a commit on the default branch that passed "Test and build".
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: curl, sodium, zip
          coverage: none
      - name: Tag is on the default branch and matches VERSION
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Regression suite
        run: php tests/run.php
      - name: Build the script and the client package
        run: |
          php build/package.php dist/site-sentinel.zip
          cp dist/sentinel.php dist/sentinel-standalone.php
          cd dist && sha256sum site-sentinel.zip sentinel-standalone.php > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/site-sentinel.zip dist/sentinel-standalone.php dist/SHA256SUMS \
            --title "Site Sentinel $GITHUB_REF_NAME" \
            --notes "Client package: download site-sentinel.zip and follow INSTALL-XNEELO.txt inside it. sentinel-standalone.php is the single script for technical installs."
